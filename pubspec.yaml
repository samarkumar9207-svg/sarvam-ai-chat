name: sarvam_ai_chat
description: A beautiful AI chat app powered by Sarvam AI — conversation history, file & image uploads, multilingual support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.2
  dio: ^5.7.0

  # Local storage
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  path: ^1.9.0

  # File & image picking
  file_picker: ^8.1.3
  image_picker: ^1.1.2

  # UI helpers
  cupertino_icons: ^1.0.8
  flutter_markdown: ^0.7.4+1
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.19.0

  # Utilities
  uuid: ^4.5.1
  path_provider: ^2.1.5
  image: ^4.2.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
